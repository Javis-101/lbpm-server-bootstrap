name: Security contact request
description: Request a private channel without disclosing sensitive details.
title: "[security-contact] "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: Use private vulnerability reporting when available. Do not publish secrets, exploit details, host identifiers, or research data here.
  - type: dropdown
    id: category
    attributes:
      label: High-level category
      options:
        - Destructive path handling
        - Shell injection or command execution
        - Archive integrity or traversal
        - Credential or private-data exposure
        - Other
    validations:
      required: true
  - type: input
    id: affected
    attributes:
      label: Affected version or commit
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Contact request
      description: State only that you need a private reporting channel; omit vulnerability details.
    validations:
      required: true
